name: KiCad design checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 7 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y kicad
          kicad-cli version
      - name: Verify SRAM selection truth table
        run: python3 tests/test_ram_select_logic.py
      - name: KiCad schematic import / netlist export
        run: |
          mkdir -p out
          kicad-cli sch export netlist -o out/elfii-32k-board.net hardware/kicad/elfii-32k-board.kicad_sch
      - name: KiCad PCB import / Gerber export
        run: |
          mkdir -p out/gerbers
          kicad-cli pcb export gerbers -l F.Cu,B.Cu,F.Mask,B.Mask,Edge.Cuts -o out/gerbers/ hardware/kicad/elfii-32k-board.kicad_pcb
      - name: Explain remaining manual verification
        run: |
          echo "KiCad 7.0.11 CLI does not expose sch erc / pcb drc."
          echo "Successful netlist / Gerber export is a parsing check, NOT ERC/DRC or fabrication validation."
      - name: Upload generated netlist and Gerbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-import-exports
          path: out/
