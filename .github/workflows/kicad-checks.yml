name: KiCad design checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
          kicad-cli version
      - name: Debug schematic load variants
        run: python3 tests/debug_schematic_load.py
      - name: Verify SRAM selection truth table
        run: python3 tests/test_ram_select_logic.py
      - name: Verify schematic grid alignment
        run: python3 tests/test_schematic_grid.py
      - name: Export reviewable schematic PDF
        run: |
          mkdir -p out
          kicad-cli sch export pdf -o out/elfii-32k-schematic.pdf hardware/kicad/elfii-32k-board.kicad_sch
      - name: KiCad schematic import / netlist export
        run: |
          mkdir -p out
          kicad-cli sch export netlist -o out/elfii-32k-board.net hardware/kicad/elfii-32k-board.kicad_sch
      - name: Verify exported KiCad pin/net assignments
        run: python3 tests/test_netlist.py out/elfii-32k-board.net
      - name: Guard disputed ELF II bus contacts
        run: python3 tests/test_bus_contact_safety.py
      - name: Require clean KiCad schematic ERC
        run: |
          kicad-cli sch erc hardware/kicad/elfii-32k-board.kicad_sch -o out/erc.txt
          cat out/erc.txt

      # During an intentional schematic-first architecture rebuild the source
      # PCB is still the previous design.  Keep that state explicit instead of
      # pretending a stale PCB matches.  Removing the marker re-enables every
      # PCB consistency/DRC guard below.
      - name: Explain deferred PCB synchronization
        if: ${{ hashFiles('hardware/kicad/SCHEMATIC_REBUILD_IN_PROGRESS') != '' }}
        run: |
          echo "Schematic-first rebuild active: PCB checks are deferred until"
          echo "hardware/kicad/SCHEMATIC_REBUILD_IN_PROGRESS is removed."

      - name: Compare schematic and PCB pad net assignments
        if: ${{ hashFiles('hardware/kicad/SCHEMATIC_REBUILD_IN_PROGRESS') == '' }}
        run: python3 tests/test_pcb_net_assignment.py out/elfii-32k-board.net hardware/kicad/elfii-32k-board.kicad_pcb
      - name: Check routed PCB copper topology and segment count
        if: ${{ hashFiles('hardware/kicad/SCHEMATIC_REBUILD_IN_PROGRESS') == '' }}
        run: python3 tests/test_track_quality.py
      - name: Guard power pad-to-zone connection settings
        if: ${{ hashFiles('hardware/kicad/SCHEMATIC_REBUILD_IN_PROGRESS') == '' }}
        run: python3 tests/test_power_pad_zone_overrides.py
      - name: Validate copper zone parser syntax
        if: ${{ hashFiles('hardware/kicad/SCHEMATIC_REBUILD_IN_PROGRESS') == '' }}
        run: python3 tests/test_pcb_zone_syntax.py
      - name: Test source PCB parser before zone fill
        if: ${{ hashFiles('hardware/kicad/SCHEMATIC_REBUILD_IN_PROGRESS') == '' }}
        run: |
          mkdir -p out/raw
          kicad-cli pcb export gerbers -l F.Cu,B.Cu,Edge.Cuts -o out/raw/ hardware/kicad/elfii-32k-board.kicad_pcb
      - name: Fill PCB copper zones into a temporary board
        if: ${{ hashFiles('hardware/kicad/SCHEMATIC_REBUILD_IN_PROGRESS') == '' }}
        run: |
          /usr/bin/python3 tests/fill_zones.py hardware/kicad/elfii-32k-board.kicad_pcb hardware/kicad/elfii-32k-board-ci-filled.kicad_pcb
      - name: Export Specctra DSN for optional offline Freerouting
        if: ${{ hashFiles('hardware/kicad/SCHEMATIC_REBUILD_IN_PROGRESS') == '' }}
        run: |
          /usr/bin/python3 scripts/export_specctra.py hardware/kicad/elfii-32k-board-ci-filled.kicad_pcb out/elfii-32k-board.dsn
      - name: KiCad PCB import / Gerber export
        if: ${{ hashFiles('hardware/kicad/SCHEMATIC_REBUILD_IN_PROGRESS') == '' }}
        run: |
          mkdir -p out/gerbers
          kicad-cli pcb export gerbers -l F.Cu,B.Cu,F.Mask,B.Mask,Edge.Cuts -o out/gerbers/ hardware/kicad/elfii-32k-board-ci-filled.kicad_pcb
      - name: Export front and back PCB SVGs for layout review
        if: ${{ hashFiles('hardware/kicad/SCHEMATIC_REBUILD_IN_PROGRESS') == '' }}
        run: |
          mkdir -p out/pcb-svg
          kicad-cli pcb export svg --mode-multi -l F.Cu,B.Cu,F.SilkS,Edge.Cuts -o out/pcb-svg/ hardware/kicad/elfii-32k-board-ci-filled.kicad_pcb
      - name: Run KiCad PCB DRC
        if: ${{ hashFiles('hardware/kicad/SCHEMATIC_REBUILD_IN_PROGRESS') == '' }}
        run: |
          kicad-cli pcb drc hardware/kicad/elfii-32k-board-ci-filled.kicad_pcb -o out/drc.txt || true
          cat out/drc.txt
      - name: Fail on introduced PCB shorts and clearance errors
        if: ${{ hashFiles('hardware/kicad/SCHEMATIC_REBUILD_IN_PROGRESS') == '' }}
        run: python3 tests/check_drc_categories.py out/drc.txt
      - name: Include source and zone-filled PCB snapshots
        if: always()
        run: |
          mkdir -p out/boards
          cp hardware/kicad/elfii-32k-board.kicad_pcb out/boards/elfii-32k-source.kicad_pcb
          if [ -f hardware/kicad/elfii-32k-board-ci-filled.kicad_pcb ]; then
            cp hardware/kicad/elfii-32k-board-ci-filled.kicad_pcb out/boards/elfii-32k-zones-filled.kicad_pcb
          fi
      - name: Upload schematic PDF, netlist and validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-import-exports
          path: out/
