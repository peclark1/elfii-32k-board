name: Hyperboard SRAM routing trial (preview only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hyperboard-routing-trial.yml"
      - "scripts/build_pcb_candidate.py"
      - "scripts/summarize_route_trial.py"
      - "hardware/kicad/elfii-32k-board.kicad_sch"
      - "hardware/kicad/ELFII_32K.kicad_sym"

permissions:
  contents: write

jobs:
  autoroute:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9 and Java 25
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Export verified schematic netlist
        run: |
          mkdir -p out/hyperboard-route
          kicad-cli sch export netlist -o out/hyperboard-route/source.net hardware/kicad/elfii-32k-board.kicad_sch
          kicad-cli sch erc --exit-code-violations -o out/hyperboard-route/erc.txt hardware/kicad/elfii-32k-board.kicad_sch
          python3 tests/test_netlist.py out/hyperboard-route/source.net
      - name: Build electrically synchronized, unrouted PCB candidate
        run: |
          /usr/bin/python3 scripts/build_pcb_candidate.py out/hyperboard-route/source.net out/hyperboard-route/unrouted.kicad_pcb
          python3 tests/test_mechanical_geometry.py out/hyperboard-route/unrouted.kicad_pcb
          python3 tests/test_pcb_net_assignment.py out/hyperboard-route/source.net out/hyperboard-route/unrouted.kicad_pcb --candidate-contact-69-open
          kicad-cli pcb drc out/hyperboard-route/unrouted.kicad_pcb -o out/hyperboard-route/drc-before.txt || true
          python3 tests/check_candidate_drc.py out/hyperboard-route/drc-before.txt
      - name: Export KiCad Specctra DSN (no changes to source PCB)
        run: |
          /usr/bin/python3 scripts/export_specctra.py out/hyperboard-route/unrouted.kicad_pcb out/hyperboard-route/board.dsn
      - name: Download pinned Freerouting release
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/freerouting/freerouting/releases/download/v2.5.0/freerouting-2.5.0.jar" \
            --output /tmp/freerouting-2.5.0.jar
          sha256sum /tmp/freerouting-2.5.0.jar | tee out/hyperboard-route/router-sha256.txt
          java -jar /tmp/freerouting-2.5.0.jar -help | head -n 35 || true
      - name: Autoroute all signal and supply nets (unapproved trial)
        run: |
          set +e
          timeout 15m java -Xmx4g -jar /tmp/freerouting-2.5.0.jar \
            --gui.enabled=false -da -mp 10 -mt 2 \
            --router.optimizer.improvement_threshold=4.0 \
            -de out/hyperboard-route/board.dsn \
            -do out/hyperboard-route/board.ses \
            > out/hyperboard-route/freerouting.log 2>&1
          status=$?
          set -e
          echo "Freerouting exit: $status"
          tail -n 80 out/hyperboard-route/freerouting.log || true
          if [ ! -s out/hyperboard-route/board.ses ]; then
            echo "No SES produced; keep trial outputs for debugging"
            exit 1
          fi
      - name: Import routed SES into separate PCB file
        run: |
          /usr/bin/python3 scripts/import_specctra.py \
            out/hyperboard-route/unrouted.kicad_pcb \
            out/hyperboard-route/board.ses \
            out/hyperboard-route/routed-preview.kicad_pcb
          python3 tests/test_mechanical_geometry.py out/hyperboard-route/routed-preview.kicad_pcb
          python3 tests/test_pcb_net_assignment.py out/hyperboard-route/source.net out/hyperboard-route/routed-preview.kicad_pcb --candidate-contact-69-open
      - name: Native KiCad DRC and routing metrics
        run: |
          kicad-cli pcb drc out/hyperboard-route/routed-preview.kicad_pcb -o out/hyperboard-route/drc-after.txt || true
          python3 scripts/summarize_route_trial.py \
            out/hyperboard-route/unrouted.kicad_pcb \
            out/hyperboard-route/routed-preview.kicad_pcb \
            out/hyperboard-route/drc-before.txt \
            out/hyperboard-route/drc-after.txt \
            out/hyperboard-route/routing-summary.json
          python3 tests/check_candidate_drc.py out/hyperboard-route/drc-after.txt
      - name: Publish zero-unconnected DRC-screened PCB to an experiment branch
        if: success()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("out/hyperboard-route/routing-summary.json").read_text())
          a = r["after"]["drc"]
          if a["unconnected_items"] != 0:
              raise SystemExit("Router left airwires; keep artifact only, do not publish branch")
          allowed = {"copper_edge_clearance", "lib_footprint_issues"}
          if any(k not in allowed for k in a["categories"]):
              raise SystemExit(f"Unexpected DRC category: {a['categories']}")
          if r["reduction_in_unconnected_items"] <= 0:
              raise SystemExit("No routing improvement")
          print("PREVIEW ONLY: physical edge, contact 69, timing, and fab holds remain")
          PY
          # A separate Git branch provides a directly openable KiCad PCB without
          # replacing main's authoritative source or dropping the safety marker.
          PREVIEW_BRANCH="experiment/hyperboard-route-${GITHUB_SHA:0:8}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$PREVIEW_BRANCH"
          cp out/hyperboard-route/routed-preview.kicad_pcb hardware/kicad/elfii-32k-board.kicad_pcb
          python3 - <<'PY'
          from pathlib import Path
          p = Path("hardware/kicad/elfii-32k-board.kicad_pcb")
          data = p.read_text()
          data = data.replace(
              '(rev "A5b - electrical prototype, routing incomplete")',
              '(rev "HYPERBOARD ROUTING PREVIEW - NOT FOR FAB")',
          )
          data = data.replace(
              '(comment 2 "UNFINISHED ROUTING / NOT FABRICATION READY")',
              '(comment 2 "DRC CHECKED, EDGE/69/82/BUS TIMING NOT VERIFIED - NO FAB")',
          )
          p.write_text(data)
          PY
          cat > docs/design/hyperboard-route-preview.md <<'EOF'
          # Hyperboard SRAM routing preview — NOT for fabrication

          This branch replaces the old A5 PCB routing **only for preview**
          with copper from a separate Freerouting 2.5 trial on the
          Hyperboard-derived KiCad 9 schematic/placement.

          This board is not authorized for fabrication or installation.
          Unresolved: edge finger-to-outline DRC findings, connector finish,
          the early Netronics contact 69/82 behavior, compatibility with
          original 2101 RAM/Giant Board, and 1802 TPA/control timing.

          The schematic's optional contact-69 disable jumper intentionally
          remains **electrically disconnected at the actual J1-69 finger**.
          SCHEMATIC_REBUILD_IN_PROGRESS stays in place for this reason:
          the preview does not yet constitute production netlist sync.

          See the routing run's uploaded hyperboard-route-preview artifact
          for before/after DRC, full routing log, and review SVGs.
          EOF
          git add hardware/kicad/elfii-32k-board.kicad_pcb docs/design/hyperboard-route-preview.md
          git commit -m "WIP: Hyperboard-derived fully connected routing preview (not for fab)"
          git push origin "HEAD:refs/heads/$PREVIEW_BRANCH"
          echo "Review branch: $PREVIEW_BRANCH"
      - name: Export front/back review SVG (NOT manufacturing Gerbers)
        if: always()
        run: |
          if [ -f out/hyperboard-route/routed-preview.kicad_pcb ]; then
            mkdir -p out/hyperboard-route/svg
            kicad-cli pcb export svg --mode-multi \
              -l F.Cu,B.Cu,F.SilkS,Edge.Cuts \
              -o out/hyperboard-route/svg/ \
              out/hyperboard-route/routed-preview.kicad_pcb || true
          fi
      - name: Upload full routing preview and DRC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperboard-route-preview
          path: out/hyperboard-route/
          retention-days: 30
