name: Inspect Hyperboard route DRC evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-hyperboard-route-drc.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read original successful route evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38273012899 \
            --repo peclark1/elfii-32k-board \
            --name hyperboard-route-preview \
            --dir out/review
          echo "=== Files in archived route trial ==="
          find out/review -maxdepth 2 -type f | sort
          echo "=== Remaining footprint-library DRC finding ==="
          grep -F -A 8 '[lib_footprint_issues]' out/review/drc-after.txt || true
          echo "=== DRC report beginning ==="
          head -n 12 out/review/drc-after.txt
          echo "=== First connector copper-to-edge finding ==="
          grep -F -A 5 -m 1 '[copper_edge_clearance]' out/review/drc-after.txt || true
          echo "=== Summarized physical checks ==="
          cat out/review/routing-summary.json
      - name: Check out fully routed review branch in actual KiCad project directory
        uses: actions/checkout@v4
        with:
          ref: experiment/hyperboard-route-b57bb49a
      - name: Install KiCad 9 for final-location DRC
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
      - name: Verify native DRC with project-local footprint libraries present
        run: |
          mkdir -p out/location-review
          kicad-cli pcb drc \
            hardware/kicad/elfii-32k-board.kicad_pcb \
            -o out/location-review/drc-in-project.txt || true
          cat out/location-review/drc-in-project.txt | grep -E 'Found [0-9]+ (DRC violations|unconnected pads|Footprint errors)' || true
          python3 tests/check_candidate_drc.py out/location-review/drc-in-project.txt
          if grep -F '[lib_footprint_issues]' out/location-review/drc-in-project.txt; then
            echo "Footprint library issue remains even inside proper KiCad project"
            exit 1
          fi
          echo "PASS: project-local connector footprint library resolves correctly"
      - name: Upload project-directory native DRC verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routed-board-project-directory-drc
          path: out/location-review/
